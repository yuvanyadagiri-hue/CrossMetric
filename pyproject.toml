[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossmetric-pipeline"
version = "1.0.0"
description = "CrossMetric data pipeline: ingests NCES and GDOT data, builds school-area road candidates, and computes Priority for Review evidence."
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=16",
  "python-dateutil>=2.9",
  "requests>=2.32",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pypdf>=5", "pglast>=7"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"
